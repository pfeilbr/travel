name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity. This public repo's Actions minutes
# are free, so it keeps them alive even when private-repo Actions are blocked by billing
# (2026-10: a billing block stopped blue-bubble-gang's own keep-alive and its project paused).
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - name: Query the Data API with the public key
        run: |
          set -euo pipefail
          key=$(python3 scripts/supabase_admin.py anon-key)
          echo "::add-mask::$key"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Data API answered HTTP $code"
          test "$code" = 200

  blue-bubble-gang:
    runs-on: ubuntu-24.04
    steps:
      - name: Health check (queries its Supabase database)
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 60 https://blue-bubble-gang.vercel.app/api/health) || true
            echo "attempt $attempt: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "::error title=blue-bubble-gang database down::/api/health is not 200. If its Supabase project is paused, resume it at https://supabase.com/dashboard/project/recrqglmhrxtqwwlhizb"
          exit 1
