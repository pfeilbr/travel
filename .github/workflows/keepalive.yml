name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity. This project is the shared
# app-platform backend for every app, so make one real Data API request each day.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Query the Data API with the public key
        run: |
          set -euo pipefail
          key=$(python3 scripts/supabase_admin.py anon-key)
          echo "::add-mask::$key"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Data API answered HTTP $code"
          test "$code" = 200
