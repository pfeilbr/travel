name: Database

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/supabase_admin.py', '.github/workflows/db.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations)
        run: supabase db start
      - name: RLS + schema tests (pgTAP)
        run: supabase test db

  migrate:
    # Apply migrations + auth settings to the hosted project (needs only the access token).
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Supabase is configured
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase not configured yet; skipping migrate."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Apply migrations (Management API)
        if: steps.cfg.outputs.ready == 'true'
        run: python3 scripts/supabase_admin.py migrate
      # Auth settings (providers, redirect allow-list) are owned by the shared platform:
      # see pfeilbr/app-platform (`app-platform add-app`). Apps never patch auth from CI.
