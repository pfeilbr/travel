name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      # Optimized images are cached between runs (npm ci clears node_modules, so restore after it).
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: astro-assets-
      - name: Public Supabase config for the browser (skipped until the project exists)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_PROJECT_REF:-}" ] && [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # A bad or expired token shouldn't block the deploy: the site works signed out, so warn loudly instead.
            if key=$(python3 scripts/supabase_admin.py anon-key); then
              echo "PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
              echo "PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
              echo "Sign-in enabled for $SUPABASE_PROJECT_REF"
            else
              echo "::warning title=Sign-in disabled::Supabase anon key lookup failed (check the SUPABASE_ACCESS_TOKEN secret); building with sign-in disabled."
            fi
          else
            echo "Supabase not configured yet; building with sign-in disabled."
          fi
      - name: Type check
        run: npx astro check
      - name: Unit tests (JS)
        run: npm test
      - name: Build
        run: npm run build
      - name: Unit tests (Python) + built-site checks
        run: python -m unittest discover -s tests -v
      - name: Validate links
        run: python scripts/check_site.py dist --base /travel
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
