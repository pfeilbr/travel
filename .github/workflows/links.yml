name: Link check

# Weekly check of the official URLs in src/data (resort sites, events, lodging, outfitters).
# A dead link (404/410, or a domain that no longer resolves) fails the run, which emails the repo owner;
# bot walls (403/429/5xx) are listed but don't fail it. Fix by pointing the entry at the current official page.
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check data URLs
        run: python3 scripts/check_links.py --json links.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: links.json
          if-no-files-found: ignore
